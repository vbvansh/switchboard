# Switchboard's packaging manifest.
#
# This file is what turns a folder of Python files into something `pip install`
# can handle. Three sections do the work, and without them the project is a
# repository you clone rather than software you install:
#
#   [build-system]      how to turn this folder into an installable archive
#   dependencies        what pip must install alongside it
#   [project.scripts]   how the `switchboard` command gets onto a user's PATH

[build-system]
# setuptools rather than a newer backend, deliberately: it is already present in
# every Python installation, so building needs no download and works offline.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The import name stays `switchboard`; this is the name on PyPI, where the
# short one is taken.
name = "switchboard-router"
# Read from switchboard/__init__.py, so the version lives in exactly one
# place. Three files used to hold three different answers.
dynamic = ["version"]
description = "A self-hostable AI model router: complexity-aware routing, budget enforcement, and an auditable savings ledger."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["llm", "router", "gateway", "cost-optimization", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# What the SERVER needs. Kept deliberately short: everything here is installed
# on every user's machine, forever. The research stack is not here - see
# [project.optional-dependencies] below.
#
# These mirror requirements.txt, and a test asserts the two agree. Two files
# exist because pip reads this one and humans read that one.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "numpy>=1.26",
    "joblib>=1.4",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# The offline evaluation harness. Large (pandas, matplotlib, datasets) and only
# needed to MEASURE routing, never to serve it:
#   pip install "switchboard-router[research]"
research = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "tabulate>=0.9",
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/vbvansh/switchboard"
Documentation = "https://github.com/vbvansh/switchboard/blob/main/docs/ARCHITECTURE.md"
Source = "https://github.com/vbvansh/switchboard"

[project.scripts]
# THIS is the line that creates the `switchboard` command. It reads as:
# "when someone types `switchboard`, import switchboard.__main__ and call cli()".
switchboard = "switchboard.__main__:cli"

[tool.setuptools.dynamic]
version = { attr = "switchboard.__version__" }

[tool.setuptools.packages.find]
# Ship the application only. `eval/` and `tests/` stay out of the wheel: the
# research harness is not something a server should carry.
include = ["switchboard*"]

[tool.setuptools.package-data]
# Files inside the package that are NOT Python and must still be installed.
# Miss any of these and the failure happens on the user's machine, not ours:
#   migrations  -> the server refuses to start against an unknown schema
#   alembic.ini -> the migration runner cannot configure itself
#   *.jsonl     -> `switchboard guardrails calibrate` has nothing to read
#
# router.joblib is the router trained across all 40 benchmark suites, and its
# .json sidecar carries the coverage table `switchboard router info` prints.
# Without them a fresh install has no router at all and every request falls to
# the ladder policy - which works, but is the weaker product.
#
# It holds fitted model weights, not the benchmark datasets: about 1.5 MB of
# derived statistics, which is a different thing from redistributing 6.6 GB of
# recorded model answers that are not ours to redistribute.
switchboard = [
    "alembic.ini",
    "*.jsonl",
    "*.yaml",
    "router.joblib",
    "router.json",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults; B008 is wrong here.
"switchboard/__main__.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
