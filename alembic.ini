# Alembic configuration.
#
# The database URL is deliberately NOT set here. It comes from Switchboard's
# own settings (SWITCHBOARD_DATABASE_URL / .env) inside migrations/env.py, so
# there is exactly one place that decides which database is in use. Two sources
# of truth would eventually disagree, and migrating the wrong database is not a
# mistake you notice quickly.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Migration filenames get a timestamp prefix so they sort chronologically in a
# directory listing, which matters once there are a few dozen.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
