# Switchboard provider registry
# ===========================================================================
# Written by `switchboard init`. Edit it freely - this is a normal
# config file and nothing regenerates it behind your back.
#
# API KEYS DO NOT GO IN THIS FILE. `api_key_env` names an environment
# variable to read the key from, so this file is safe to commit.
# ===========================================================================

# The model a 'give everyone the best' setup would use. Every request
# records what it WOULD have cost here - that difference is the
# savings figure on the dashboard.
baseline_model: "qwen3:4b"

# Models the router may choose between, CHEAPEST FIRST. The order is
# validated on load, and escalation climbs it one rung at a time.
ladder:
  - "qwen3:4b"

# Fallback for a model not declared below. Never zero: an unpriced
# model costing nothing would understate spend and overstate savings.
default_pricing:
  input_per_mtok: 1.0
  output_per_mtok: 5.0

providers:

  # Ollama (local, free, no key) - runs on your machine; nothing leaves the host
  - id: ollama-local
    type: openai-compatible
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
    enabled: true
    # Local inference is free. Each model wears the price
    # tag of the commercial model it stands in for, so
    # budgets and savings mean something. No real money.
    simulated_pricing: true
    timeout_seconds: 600  # a cold load can be slow
    models:
      - id: "qwen3:4b"
        tier: T1
        stands_in_for: "small general-purpose tier"
        input_per_mtok: 0.25
        output_per_mtok: 1.25


  # OpenRouter (one key, hundreds of models, publishes prices) - the only provider whose API gives real prices - start here
  - id: openrouter
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    enabled: false
    models: []

  # OpenAI - publishes no prices; you will be asked for them
  - id: openai
    type: openai-compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    enabled: false
    models: []

  # Anthropic (Claude) - native adapter; tool calls go via OpenRouter instead
  - id: anthropic
    type: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    enabled: false
    models: []

  # Google Gemini - native adapter; tool calls go via OpenRouter instead
  - id: gemini
    type: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    enabled: false
    models: []

  # Groq (fast, has a free tier) - cheapest way to verify a real remote provider end to end
  - id: groq
    type: openai-compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    enabled: false
    models: []
